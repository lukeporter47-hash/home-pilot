<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home-Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F6F5; --surface: #FFFFFF; --ink: #14262C; --muted: #55696F; --line: #D9E3E1;
    --accent: #1B7A6B; --accent-ink: #FFFFFF; --warn: #B7391F; --ok-bg: #E3F1EE;
    --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
    --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F1B1F; --surface: #17272C; --ink: #E8F1EF; --muted: #97ABB0; --line: #27393F; --accent: #3FB5A2; --accent-ink: #08201C; --warn: #F08466; --ok-bg: #16332E; }
  }
  * { box-sizing: border-box; }
  html, body { overscroll-behavior-y: contain; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 24px 20px calc(40px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.1; margin: 0 0 6px; letter-spacing: -0.02em; }
  p.lead { color: var(--muted); margin: 0 0 26px; font-size: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
  .glogin { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; font-weight: 600; font-size: 16px; }
  .glogin img { width: 20px; height: 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
  .field input { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 12px; font-size: 16px; }
  .field .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .people { display: grid; gap: 10px; margin-bottom: 18px; }
  .person { display: flex; align-items: center; gap: 10px; }
  .person input { flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 11px 12px; font-size: 16px; }
  .person .badge { width: 30px; height: 30px; border-radius: 50%; background: var(--ok-bg); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
  .stepper { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .stepper button { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; font-weight: 600; }
  .stepper .n { font-family: var(--font-display); font-weight: 700; font-size: 20px; min-width: 24px; text-align: center; }
  .bigbtn { width: 100%; border: 0; border-radius: 14px; padding: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 17px; margin-top: 4px; }
  .bigbtn[disabled] { opacity: .55; cursor: not-allowed; }
  .signout { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; display: block; margin: 18px auto 0; }
  .err { color: var(--warn); font-weight: 600; margin: 12px 0 0; font-size: 14px; min-height: 20px; }
  .center { text-align: center; }
  .who { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .who img { width: 36px; height: 36px; border-radius: 50%; }
  .who .nm { font-weight: 600; }
  .who .em { color: var(--muted); font-size: 13px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- Step 1: sign in -->
  <div id="view-signin">
    <h1>Home-Pilot</h1>
    <p class="lead">The household app, for every family. Sign in to get started.</p>
    <div class="card">
      <button class="glogin" id="btn-google">
        <img alt="" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHBhdGggZmlsbD0iI0ZGQzEwNyIgZD0iTTQzLjYxMSwyMC4wODNINDJWMjBIMjR2OGgxMS4zMDNjLTEuNjQ5LDQuNjU3LTYuMDgsOC0xMS4zMDMsOGMtNi42MjcsMC0xMi01LjM3My0xMi0xMnM1LjM3My0xMiwxMi0xMmMzLjA1OSwwLDUuODQyLDEuMTU0LDcuOTYxLDMuMDM5bDUuNjU3LTUuNjU3QzM0LjA0Niw2LjA1MywyOS4yNjgsNCwyNCw0QzEyLjk1NSw0LDQsMTIuOTU1LDQsMjRzOC45NTUsMjAsMjAsMjBzMjAtOC45NTUsMjAtMjBDNDQsMjIuNjU5LDQzLjg2MiwyMS4zNSw0My42MTEsMjAuMDgzeiIvPjxwYXRoIGZpbGw9IiNGRjNEMDAiIGQ9Ik02LjMwNiwxNC42OTFsNi41NzEsNC44MTlDMTQuNjU1LDE1LjEwOCwxOC45NjEsMTIsMjQsMTJjMy4wNTksMCw1Ljg0MiwxLjE1NCw3Ljk2MSwzLjAzOWw1LjY1Ny01LjY1N0MzNC4wNDYsNi4wNTMsMjkuMjY4LDQsMjQsNEMxNi4zMTgsNCw5LjY1Niw4LjMzNyw2LjMwNiwxNC42OTF6Ii8+PHBhdGggZmlsbD0iIzRDQUY1MCIgZD0iTTI0LDQ0YzUuMTY2LDAsOS44Ni0xLjk3NywxMy40MDktNS4xOTJsLTYuMTktNS4yMzhDMjkuMjExLDM1LjA5MSwyNi43MTUsMzYsMjQsMzZjLTUuMjAyLDAtOS42MTktMy4zMTctMTEuMjgzLTcuOTQ2bC02LjUyMiw1LjAyNUM5LjUwNSwzOS41NTYsMTYuMjI3LDQ0LDI0LDQ0eiIvPjxwYXRoIGZpbGw9IiMxOTc2RDIiIGQ9Ik00My42MTEsMjAuMDgzSDQyVjIwSDI0djhoMTEuMzAzYy0wLjc5MiwyLjIzNy0yLjIzMSw0LjE2Ni00LjA4NSw1LjU3MWMwLjAwMS0wLjAwMSwwLjAwMi0wLjAwMSwwLjAwMy0wLjAwMmw2LjE5LDUuMjM4QzM3LjAyNSwzOC4wNTEsNDQsMzMsNDQsMjRDNDQsMjIuNjU5LDQzLjg2MiwyMS4zNSw0My42MTEsMjAuMDgzeiIvPjwvc3ZnPg==">
        Sign in with Google
      </button>
      <p class="err" id="signin-err" role="alert"></p>
    </div>
  </div>

  <!-- Loading, shown while we check whether this person already has a household -->
  <div id="view-loading" style="display:none">
    <div class="spinner"></div>
    <p class="center" style="color:var(--muted)">One moment&hellip;</p>
  </div>

  <!-- Step 2: create the household (only shown if this Google account has none yet) -->
  <div id="view-create" style="display:none">
    <h1>Set up your household</h1>
    <p class="lead">You'll be the admin, able to invite the rest of your household later.</p>
    <div class="who" id="who-box"></div>
    <div class="card">
      <div class="field">
        <label for="hh-name">Household name</label>
        <input id="hh-name" type="text" maxlength="60" autocomplete="off" placeholder="e.g. The Porters">
      </div>
      <label style="font-weight:600;display:block;margin-bottom:5px;font-size:14px">How many people in your household?</label>
      <div class="stepper">
        <button id="hh-minus" type="button" aria-label="Fewer people">&minus;</button>
        <div class="n" id="hh-count">2</div>
        <button id="hh-plus" type="button" aria-label="More people">+</button>
      </div>
      <label style="font-weight:600;display:block;margin-bottom:8px;font-size:14px">Everyone's name</label>
      <div class="people" id="hh-people"></div>
      <button class="bigbtn" id="hh-save">Create household</button>
      <p class="err" id="create-err" role="alert"></p>
    </div>
    <button class="signout" id="btn-signout-create">Sign out</button>
  </div>

  <!-- Step 3: already registered -->
  <div id="view-ready" style="display:none">
    <h1>You're all set</h1>
    <p class="lead" id="ready-lead"></p>
    <div class="card center">
      <p style="margin:0 0 4px;color:var(--muted)">The rest of the app is being built next.</p>
      <p style="margin:0;font-weight:600" id="ready-household"></p>
    </div>
    <button class="signout" id="btn-signout-ready">Sign out</button>
  </div>

</div>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(window.HOME_PILOT_FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

function $(id) { return document.getElementById(id); }
function show(id) {
  ["view-signin", "view-loading", "view-create", "view-ready"].forEach(function (v) {
    $(v).style.display = v === id ? "" : "none";
  });
}
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function msg(err) { return ((err && err.message) || "Something went wrong. Please try again.").replace(/^Firebase:\s*/, "").replace(/\s*\(auth\/[^)]+\)\.?$/, "").replace(/\s*\(permission-denied\)\.?$/, "You don't have access to that."); }

// ---------- Sign in ----------
$("btn-google").addEventListener("click", function () {
  $("signin-err").textContent = "";
  signInWithPopup(auth, provider).catch(function (err) {
    if (err && err.code === "auth/popup-closed-by-user") return;
    $("signin-err").textContent = msg(err);
  });
});
$("btn-signout-create").addEventListener("click", function () { signOut(auth); });
$("btn-signout-ready").addEventListener("click", function () { signOut(auth); });

// ---------- Once signed in: find out if this person already belongs to a household ----------
onAuthStateChanged(auth, function (user) {
  if (!user) { show("view-signin"); return; }
  show("view-loading");
  var q = query(collection(db, "households"), where("memberUids", "array-contains", user.uid), limit(1));
  getDocs(q).then(function (snap) {
    if (!snap.empty) {
      var hh = snap.docs[0].data();
      $("ready-lead").textContent = "Signed in as " + (user.displayName || user.email) + ".";
      $("ready-household").textContent = hh.name || "Your household";
      show("view-ready");
    } else {
      renderCreateForm(user);
      show("view-create");
    }
  }).catch(function (err) {
    $("signin-err").textContent = msg(err);
    show("view-signin");
  });
});

// ---------- Create-household form ----------
var peopleCount = 2, peopleNames = [];
function renderCreateForm(user) {
  var who = $("who-box"); who.innerHTML = "";
  if (user.photoURL) { var img = el("img"); img.src = user.photoURL; img.alt = ""; who.appendChild(img); }
  var tx = el("div");
  tx.appendChild(el("div", "nm", user.displayName || "You"));
  tx.appendChild(el("div", "em", user.email || ""));
  who.appendChild(tx);

  if (!peopleNames.length) peopleNames = [user.displayName ? user.displayName.split(" ")[0] : "", ""];
  $("hh-count").textContent = String(peopleCount);
  renderPeopleFields();
}
function renderPeopleFields() {
  var box = $("hh-people"); box.innerHTML = "";
  while (peopleNames.length < peopleCount) peopleNames.push("");
  peopleNames.length = peopleCount;
  for (var i = 0; i < peopleCount; i++) {
    (function (idx) {
      var row = el("div", "person");
      var badge = el("div", "badge", String(idx + 1));
      var inp = document.createElement("input");
      inp.type = "text"; inp.maxLength = 30; inp.autocomplete = "off";
      inp.placeholder = idx === 0 ? "Your name" : "e.g. Partner, child's name";
      inp.value = peopleNames[idx] || "";
      inp.addEventListener("input", function () { peopleNames[idx] = inp.value; });
      row.appendChild(badge); row.appendChild(inp);
      box.appendChild(row);
    })(i);
  }
}
$("hh-minus").addEventListener("click", function () { if (peopleCount > 1) { peopleCount--; $("hh-count").textContent = String(peopleCount); renderPeopleFields(); } });
$("hh-plus").addEventListener("click", function () { if (peopleCount < 12) { peopleCount++; $("hh-count").textContent = String(peopleCount); renderPeopleFields(); } });

$("hh-save").addEventListener("click", function () {
  var user = auth.currentUser;
  if (!user) return;
  var hhName = $("hh-name").value.trim();
  var names = peopleNames.map(function (n) { return n.trim(); }).filter(Boolean);
  $("create-err").textContent = "";
  if (!hhName) { $("create-err").textContent = "Please enter a household name."; return; }
  if (names.length < 1) { $("create-err").textContent = "Please enter at least one name."; return; }

  var btn = $("hh-save"); btn.disabled = true; btn.textContent = "Creating\u2026";
  addDoc(collection(db, "households"), {
    name: hhName,
    people: names,
    adminUid: user.uid,
    adminEmail: user.email || "",
    memberUids: [user.uid],
    createdAt: serverTimestamp()
  }).then(function () {
    $("ready-lead").textContent = "Signed in as " + (user.displayName || user.email) + ".";
    $("ready-household").textContent = hhName;
    show("view-ready");
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = "Create household";
    $("create-err").textContent = msg(err);
  });
});
</script>
</body>
</html>
